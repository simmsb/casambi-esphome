[package]
name = "casambi-config"
version = "0.1.0"
edition = "2021"
description = "One-shot Casambi cloud config generator for ESPHome"
license = "MIT"

[[bin]]
name = "casambi-config"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
